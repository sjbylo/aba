# images.conf — extra container images for oc-mirror additionalImages
# One image ref per line. Blank lines and lines starting with # are ignored.
# Leading/trailing whitespace is stripped.
# Edit this file directly, or use: aba image add <image:tag>
#
# Examples:
#registry.redhat.io/openshift4/ose-cli:latest
#registry.redhat.io/rhel9/support-tools:latest
#registry.redhat.io/ubi9/ubi:latest
#quay.io/containerdisks/centos-stream:9
#quay.io/containerdisks/fedora:latest
