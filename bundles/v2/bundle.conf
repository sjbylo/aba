#!/bin/bash
# bundle.conf - Configuration for v2 bundle pipeline
# Edit these values for your environment

BASE_DOM=$(hostname -d)
NTP_IP=10.0.1.8
TEST_HOST=$(hostname -s).$BASE_DOM
PS_FILE='~/.pull-secret.json'

WORK_DIR=$PWD/work
TEMPLATES_DIR=$(cd "$(dirname "${BASH_SOURCE[0]}")/templates" 2>/dev/null && pwd)
CLOUD_DIR=/nas/redhat/aba-openshift-install-bundles

# Cluster settings for test installation
CLUSTER_NAME=bundle-compact
CLUSTER_TYPE=compact
CLUSTER_STARTING_IP=10.0.1.75
CLUSTER_API_VIP=10.0.1.223
CLUSTER_INGRESS_VIP=10.0.1.233
CLUSTER_MEM=45  # Required for OPP
CLUSTER_CPU=20  # Required for OPP
CLUSTER_PLATFORM=vmw

# Internal network gateway (used to create a temp default route for pasta hairpin)
GATEWAY_IP=10.0.1.1

# Git branch to install aba from.
# MUST be 'main' for release bundles — that's what users get.
# Use 'go.sh --dev' to override with 'dev' for testing dev-branch features
# (dev bundles are never uploaded to NAS).
#
# IMPORTANT: The bundle build/test architecture has THREE layers:
#   1. Phase scripts (bundles/v2/scripts/06*.sh) — always from workspace (dev)
#   2. Test scripts (bundles/v2/templates/test-*.sh) — always from workspace (dev)
#   3. ABA code in the bundle — from GIT_BRANCH (main by default)
#
# Layers 1+2 are test harness; layer 3 is the product under test.
# When layer 1 or 2 depends on ABA features only in dev (e.g. new marker
# files, new CLI targets), use 'go.sh --dev' so all layers are consistent.
# Otherwise, write test/phase scripts defensively — handle missing files
# and older behavior gracefully.
GIT_BRANCH=${GIT_BRANCH:-main}
