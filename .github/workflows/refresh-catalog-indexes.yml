name: Refresh Catalog Indexes

on:
  schedule:
    - cron: '15 */8 * * *'  # Every 8 hours at :15
  workflow_dispatch:         # Manual trigger

env:
  IMAGE: quay.io/sjbylo/aba-catalog-indexes:latest
  # OCP versions to include (space-separated)
  OCP_VERSIONS: "4.17 4.18 4.19 4.20 4.21 4.22 4.23 5.0"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo jq

      - name: Log in to Red Hat registry
        run: |
          echo "${{ secrets.RH_REGISTRY_TOKEN }}" | \
            podman login -u '${{ secrets.RH_REGISTRY_USER }}' --password-stdin registry.redhat.io

      - name: Log in to Quay.io
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | \
            podman login -u '${{ secrets.QUAY_USER }}' --password-stdin quay.io

      - name: Pull and extract catalog indexes
        run: |
          # Display name extraction — mirrors scripts/download-catalog-index.sh logic
          _display_name_from_bundles() {
            local search_dir="$1" dn=""
            while IFS= read -r -d '' f; do
              local candidate=""
              candidate=$(jq -r '
                if .schema == "olm.bundle" then
                  (.properties[]? | select(.type=="olm.csv.metadata") | .value.displayName // empty)
                elif .properties then
                  (.properties[]? | select(.type=="olm.csv.metadata") | .value.displayName // empty)
                else empty end
              ' "$f" 2>/dev/null | head -1)
              if [ -z "$candidate" ]; then
                candidate=$(jq -r '
                  select(.schema == "olm.bundle") |
                  .properties[]? | select(.type == "olm.bundle.object") |
                  .value.data
                ' "$f" 2>/dev/null | base64 -d 2>/dev/null | jq -r '.spec.displayName // empty' 2>/dev/null | head -1)
              fi
              [ -n "$candidate" ] && dn="$candidate"
            done < <(find "$search_dir" -name '*.json' -print0 2>/dev/null)
            echo "$dn"
          }

          _extract_from_json() {
            local dir="$1" pkg_src="$2"
            local pkg="" def_ch=""
            read -r pkg def_ch < <(jq -r 'select(.schema=="olm.package") | "\(.name) \(.defaultChannel)"' "$pkg_src" 2>/dev/null) || true
            if [ -z "$pkg" ] || [ -z "$def_ch" ]; then
              for f in "$dir"/*.json; do
                [ -f "$f" ] || continue
                [ "$f" = "$pkg_src" ] && continue
                read -r pkg def_ch < <(jq -r 'select(.schema=="olm.package") | "\(.name) \(.defaultChannel)"' "$f" 2>/dev/null) || true
                [ -n "$pkg" ] && [ -n "$def_ch" ] && break
              done
            fi
            [ -z "$pkg" ] || [ -z "$def_ch" ] && return 1
            local display_name=""
            display_name=$(jq -r 'select(.schema=="olm.bundle") | .properties[]? | select(.type=="olm.csv.metadata") | .value.displayName // empty' "$pkg_src" 2>/dev/null | tail -1)
            if [ -z "$display_name" ]; then
              display_name=$(jq -r 'select(.schema=="olm.bundle") | .properties[]? | select(.type=="olm.bundle.object") | .value.data' "$pkg_src" 2>/dev/null | base64 -d 2>/dev/null | jq -r '.spec.displayName // empty' 2>/dev/null | tail -1)
            fi
            if [ -z "$display_name" ]; then
              display_name=$(_display_name_from_bundles "$dir")
            fi
            printf "%-55s %-60s %s\n" "$pkg" "${display_name:--}" "$def_ch"
          }

          _extract_from_yaml() {
            local yf="$1"
            local pkg="" def_ch=""
            read pkg def_ch < <(awk '
              /^---/ { if (schema == "olm.package" && name && defch) { print name, defch; exit } name=""; defch=""; schema="" }
              /^name: / { name=$2 }
              /^defaultChannel: / { defch=$2 }
              /^schema: / { schema=$2 }
              END { if (schema == "olm.package" && name && defch) print name, defch }
            ' "$yf" 2>/dev/null) || true
            [ -z "$pkg" ] || [ -z "$def_ch" ] && return 1
            local display_name="" dir_path
            dir_path="$(dirname "$yf")"
            display_name=$(grep '^ *displayName:' "$yf" 2>/dev/null | grep -v 'x-descriptors' | tail -1 | sed 's/.*displayName: *//' | sed "s/^['\"]//;s/['\"]$//")
            if [ -z "$display_name" ]; then
              while IFS= read -r -d '' _sf; do
                [ "$_sf" = "$yf" ] && continue
                display_name=$(grep '^ *displayName:' "$_sf" 2>/dev/null | grep -v 'x-descriptors' | tail -1 | sed 's/.*displayName: *//' | sed "s/^['\"]//;s/['\"]$//")
                [ -n "$display_name" ] && break
              done < <(find "$dir_path" \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) -print0 2>/dev/null)
            fi
            printf "%-55s %-60s %s\n" "$pkg" "${display_name:--}" "$def_ch"
          }

          mkdir -p .index
          for ver in $OCP_VERSIONS; do
            for catalog in redhat-operator certified-operator community-operator; do
              img="registry.redhat.io/redhat/${catalog}-index:v${ver}"
              outfile=".index/${catalog}-index-v${ver}"
              echo "::group::${catalog} v${ver}"
              echo "Pulling $img ..."
              if ! podman pull --quiet "$img" 2>/dev/null; then
                echo "Warning: $img not available, skipping"
                echo "::endgroup::"
                continue
              fi
              cid=$(podman create "$img" true 2>/dev/null)
              tmpdir="/tmp/configs-$$"
              podman cp "$cid":/configs/. "$tmpdir" 2>/dev/null || true
              podman rm "$cid" >/dev/null 2>&1
              if [ -d "$tmpdir" ]; then
                expected=$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d -not -name '_*' | wc -l)
                echo "$expected" > ".index/.${catalog}-index-v${ver}.expected-count"
                (
                  set +e
                  for dir in "$tmpdir"/*/; do
                    [ -d "$dir" ] || continue
                    [[ "$(basename "$dir")" == _* ]] && continue
                    if [ -f "$dir/package.json" ]; then
                      _extract_from_json "$dir" "$dir/package.json"
                    elif [ -f "$dir/catalog.json" ]; then
                      _extract_from_json "$dir" "$dir/catalog.json"
                    elif [ -f "$dir/index.json" ]; then
                      _extract_from_json "$dir" "$dir/index.json"
                    elif [ -f "$dir/package.yaml" ]; then
                      _extract_from_yaml "$dir/package.yaml"
                    elif compgen -G "$dir"'*.yaml' >/dev/null 2>&1 || compgen -G "$dir"'*.yml' >/dev/null 2>&1; then
                      for yf in "$dir"/*.yaml "$dir"/*.yml; do
                        [ -f "$yf" ] || continue
                        _extract_from_yaml "$yf" && break
                      done
                    else
                      for f in "$dir"/*.json; do
                        [ -f "$f" ] || continue
                        _extract_from_json "$dir" "$f" && break
                      done
                    fi
                  done
                ) | sort > "$outfile"
                rm -rf "$tmpdir"
              fi
              count=$(wc -l < "$outfile" 2>/dev/null || echo 0)
              echo "Extracted $count operators"
              echo "::endgroup::"
            done
          done

      - name: Verify indexes
        run: |
          errors=0

          echo "=== 1. Presence and expected-count check ==="
          for ver in $OCP_VERSIONS; do
            for catalog in redhat-operator certified-operator community-operator; do
              f=".index/${catalog}-index-v${ver}"
              ec_file=".index/.${catalog}-index-v${ver}.expected-count"
              if [ ! -s "$f" ]; then
                echo "::error::MISSING: $f"
                errors=$(( errors + 1 ))
                continue
              fi
              actual=$(wc -l < "$f")
              expected=0
              [ -f "$ec_file" ] && expected=$(< "$ec_file")
              if [ "$expected" -gt 0 ] && [ "$actual" -ne "$expected" ]; then
                echo "::warning::COUNT MISMATCH: ${catalog} v${ver}: extracted ${actual}, expected ${expected}"
              fi
              printf "  %-25s v%-6s %3d / %3d operators\n" "$catalog" "$ver" "$actual" "$expected"
            done
          done

          echo ""
          echo "=== 2. Syntax validation (every line: name display-text channel) ==="
          for f in .index/*-operator-index-v*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            bad_lines=$(grep -cvE '^[a-z][a-z0-9._-]+\s+\S+.*\S+\s*$' "$f" || true)
            if [ "$bad_lines" -gt 0 ]; then
              echo "::error::SYNTAX: $fname has $bad_lines malformed line(s):"
              grep -vnE '^[a-z][a-z0-9._-]+\s+\S+.*\S+\s*$' "$f" | head -5
              errors=$(( errors + 1 ))
            fi
            dup_names=$(awk '{print $1}' "$f" | sort | uniq -d)
            if [ -n "$dup_names" ]; then
              echo "::warning::DUPLICATES in $fname: $dup_names"
            fi
          done

          echo ""
          echo "=== 3. Sentinel operator checks ==="
          declare -A sentinels
          sentinels[redhat-operator]="cincinnati-operator cluster-logging advanced-cluster-management"
          sentinels[certified-operator]="cert-manager gpu-operator-certified"
          sentinels[community-operator]="argocd-operator prometheus"

          latest_ver=$(echo "$OCP_VERSIONS" | tr ' ' '\n' | sort -V | tail -1)
          for catalog in redhat-operator certified-operator community-operator; do
            f=".index/${catalog}-index-v${latest_ver}"
            [ -s "$f" ] || continue
            for sentinel in ${sentinels[$catalog]}; do
              if ! grep -q "^${sentinel} " "$f"; then
                echo "::error::SENTINEL MISSING: ${sentinel} not found in ${catalog} v${latest_ver}"
                errors=$(( errors + 1 ))
              else
                echo "  OK: ${sentinel} found in ${catalog} v${latest_ver}"
              fi
            done
          done

          echo ""
          echo "=== 4. Display name spot-check ==="
          for catalog in redhat-operator certified-operator community-operator; do
            f=".index/${catalog}-index-v${latest_ver}"
            [ -s "$f" ] || continue
            dashes=$(awk '$2 == "-"' "$f" | wc -l)
            total=$(wc -l < "$f")
            pct=0
            [ "$total" -gt 0 ] && pct=$(( dashes * 100 / total ))
            if [ "$pct" -gt 20 ]; then
              echo "::warning::DISPLAY NAMES: ${catalog} v${latest_ver} has ${dashes}/${total} (${pct}%) missing display names"
            else
              echo "  OK: ${catalog} v${latest_ver}: ${dashes}/${total} missing display names (${pct}%)"
            fi
            same=$(awk '$1 == $2' "$f" | wc -l)
            if [ "$same" -gt 5 ]; then
              echo "::warning::DISPLAY NAMES: ${catalog} v${latest_ver} has ${same} entries where display name equals package name"
            fi
          done

          echo ""
          if [ "$errors" -gt 0 ]; then
            echo "::error::Validation failed with $errors error(s)"
            exit 1
          fi
          echo "=== All checks passed ==="

      - name: Build and push image
        run: |
          builddir=$(mktemp -d)
          cp -r .index "$builddir/catalogs"
          cat > "$builddir/Containerfile" << 'CEOF'
          FROM scratch
          COPY catalogs/ /catalogs/
          CEOF
          podman build -f "$builddir/Containerfile" -t "$IMAGE" "$builddir"
          podman push "$IMAGE"
          echo "Pushed $IMAGE"
          rm -rf "$builddir"

      - name: Summary
        run: |
          echo "### Catalog Index Image Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Version | redhat-operator | certified-operator | community-operator |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------------|--------------------|--------------------|" >> $GITHUB_STEP_SUMMARY
          for ver in $OCP_VERSIONS; do
            rh="-"; ce="-"; co="-"
            [ -s ".index/redhat-operator-index-v${ver}" ] && rh=$(wc -l < ".index/redhat-operator-index-v${ver}")
            [ -s ".index/certified-operator-index-v${ver}" ] && ce=$(wc -l < ".index/certified-operator-index-v${ver}")
            [ -s ".index/community-operator-index-v${ver}" ] && co=$(wc -l < ".index/community-operator-index-v${ver}")
            echo "| $ver | $rh | $ce | $co |" >> $GITHUB_STEP_SUMMARY
          done
